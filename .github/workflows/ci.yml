name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fixtures:
    name: Fixture conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # Fails only if a NON-legacy fixture breaks. The legacy drift report is
      # printed for review but does not fail the build — see spec/06-migration.md.
      - run: npm test
