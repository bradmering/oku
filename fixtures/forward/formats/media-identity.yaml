    - id: med_0001
      src: /images/media-identity/IMG_4724.webp
      kind: image
      capturedAt: "2026-05-02T15:12:00Z"
      coordinates: [-109.99046, 38.50941]
      legId: leg_d1
      renditions:
        original: /images/media-identity/IMG_4724.JPG
        thumb: /images/media-identity/IMG_4724.thumb.webp
    - id: med_0002
      src: /images/media-identity/IMG_4764.webp
      kind: image
      capturedAt: "2026-05-02T17:40:00Z"
      legId: leg_d1
    - id: med_0003
      src: /videos/media-identity/IMG_2424.mp4
