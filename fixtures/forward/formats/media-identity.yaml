# Exercises media identity (decisions/0016):
#   · chapters referencing media by `mediaId` / `imageId` instead of a bare path
#   · `src` still legal in the SAME document — hand-written and ingested refs mix
#   · article media `type` omitted and filled from the media item's `kind`
#   · a ref's own `poster` beating the media item's
#   · `renditions` on a media item, with `src` as the path to serve
#   · a media item nobody references (fusion output the author didn't use)
#
# What to look at: bake this and read `lib/trips.generated.json` — every `mediaId`
# should be gone, replaced by the item's `src`, and no renderer knows the difference.

specVersion: 1
