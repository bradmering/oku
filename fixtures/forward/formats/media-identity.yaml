    - id: med_0004
      src: /images/media-identity/IMG_4890.webp
      kind: image
      capturedAt: "2026-05-03T01:05:00Z"
      legId: leg_d1

chapters:
  # imageId, not image.
  - id: ch_title
    type: title
    layout: image
    imageId: med_0001
    heading: "Referencing media by id"

  - id: ch_day1
    type: article
    heading: "Day 1"
    stats:
      legId: leg_d1
    text: |
      The hero comes from `sources.media[]`; the strip below mixes an id-based
      reference with a literal path, because both are correct.
    heroImage:
      mediaId: med_0002
      caption: "Caption lives on the reference — sources hold facts, chapters hold voice."
    media:
      # No `type`: it is `kind` on the item, and the resolver fills it in.
      - mediaId: med_0001
        caption: "Dropping into Mineral Bottom"
      # No `poster` here either — inherited from the media item.
      - mediaId: med_0003
        caption: "The wash below Murphy"
        loop: true
      # A literal path in the same document as the ids above.
      - type: image
        src: /images/media-identity/IMG_4769.webp
        caption: "Hand-written, no sources entry, still valid"

  # A gallery mixing both forms.
  - id: ch_gallery
    type: gallery
    layout: trio
    images:
      - mediaId: med_0001
      - mediaId: med_0002
        caption: "The reference's caption wins"
      - src: /images/media-identity/IMG_4777.webp
        caption: "Literal"

  # The ref's own poster beats the item's.
  - id: ch_video
    type: video
    mediaId: med_0003
    poster: /images/media-identity/IMG_4840.webp
    caption: "Explicit poster overrides the media item's"
